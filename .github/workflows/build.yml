# Builds the core, runs the tests on three OSes, and publishes the Windows/Linux binaries to the `dist` branch
# so they can be downloaded with a plain link:
#   https://github.com/dal23fas/sadboxwar/raw/dist/windows/ef_server.exe
name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --output-on-failure
      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p out
          cp build/Release/ef_server.exe build/Release/ef_headless.exe out/ 2>/dev/null || cp build/ef_server build/ef_headless out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ef_server-${{ matrix.os }}
          path: out/*

  publish:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Commit binaries to the dist branch
        shell: bash
        run: |
          set -e
          SHA=$(git rev-parse --short HEAD)
          git config user.name "earth-frontier-ci"
          git config user.email "ci@earthfrontier.local"
          if git ls-remote --exit-code origin dist >/dev/null 2>&1; then
            git fetch origin dist && git checkout dist
          else
            git checkout --orphan dist && git rm -rf -q . || true
          fi
          mkdir -p windows linux macos
          cp artifacts/ef_server-windows-latest/* windows/ || true
          cp artifacts/ef_server-ubuntu-latest/* linux/ || true
          cp artifacts/ef_server-macos-latest/* macos/ || true
          chmod +x linux/* macos/* 2>/dev/null || true
          printf "EARTH FRONTIER binaries built from main @ %s\n\nwindows/ef_server.exe  - run this, keep the window open, then Play in Godot\nwindows/ef_headless.exe - acceptance script (needs Content/Data/asterion_island_v1.json path)\n" "$SHA" > README.txt
          git add -A
          git commit -q -m "dist: binaries from $SHA" || echo "nothing to commit"
          git push origin dist
